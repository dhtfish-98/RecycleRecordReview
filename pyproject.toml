[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recyclerecordreview"
version = "1.0.2"
authors = [{ name = "dhtfish98" }]
description = "Bounded offline evidence review: RecycleRecordReview"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["项目文档/LICENSE", "项目文档/NEW_IMPLEMENTATION_NOTICE.txt"]
dependencies = []

[project.scripts]
recyclerecordreview = "recyclerecordreview.core:main"

[tool.setuptools.packages.find]
where = ["src"]
